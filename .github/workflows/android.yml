name: Android CI

on:
  push:
    branches: [ "main", "dev" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Single source of truth for Gradle caching: caches ~/.gradle/caches,
      # ~/.gradle/wrapper, and the local build cache, keyed on
      # build.gradle/settings.gradle/gradle-wrapper.properties etc. Replaces
      # the ad-hoc `cache: gradle` from setup-java and the per-step
      # burrunan/gradle-cache-action that we used to run the unit tests.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: touch local.properties

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: |
          echo $ENCODED_STRING | base64 -di > release.keystore

      # Cache the Robolectric framework jars across runs. Key includes the
      # workflow file hash so a change to the version list invalidates it.
      - name: Cache Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.robolectric
          key: robolectric-jars-${{ runner.os }}-${{ hashFiles('.github/workflows/android.yml') }}
          restore-keys: |
            robolectric-jars-${{ runner.os }}-

      - name: Download Robolectric jars
        # The unit tests set `robolectric.offline=true` on CI and expect the
        # framework jars at ~/.robolectric/. If a download is silently
        # corrupt (e.g. Maven Central serves a 404 HTML page), Robolectric
        # boots with a broken framework jar, `AndroidVersions.CURRENT` ends
        # up null, and every Robolectric test blows up with confusing errors
        # like `NoSuchFieldError: noncompatWidthPixels`. So: `--fail` turns
        # HTTP errors into curl failures, `--retry` handles transient CDN
        # blips, and the size assertion catches the rare case where Maven
        # Central 200's with a tiny error body.
        #
        # Each version pair is "<androidVersion>-robolectric-<frameworkSdkBuildVersion>"
        # for one supported API level, taken from Robolectric 4.16.1's
        # AndroidSdk.kt. The set must cover every API level any test pins
        # via @Config(sdk = [...]).
        run: |
          mkdir -p ~/.robolectric
          # apiLevel:versionString — keep in sync with @Config(sdk=[...]) in mobile/src/test.
          versions=(
            "26:8.0.0_r4-robolectric-r1"
            "27:8.1.0-robolectric-4611349"
            "28:9-robolectric-4913185-2"
            "29:10-robolectric-5803371"
            "30:11-robolectric-6757853"
            "31:12-robolectric-7732740"
            "32:12.1-robolectric-8229987"
            "33:13-robolectric-9030017"
            "34:14-robolectric-10818077"
            "35:15-robolectric-13954326"
            "36:16-robolectric-13921718"
          )
          for entry in "${versions[@]}"; do
            v="${entry#*:}-i7"
            jar=~/.robolectric/android-all-instrumented-$v.jar
            if [ -f "$jar" ] && [ "$(stat -c%s "$jar")" -ge 50000000 ]; then
              echo "Cached: $v ($(stat -c%s "$jar") bytes)"
              continue
            fi
            echo "Downloading $v"
            curl -L --fail --retry 5 --retry-delay 10 --retry-all-errors \
              -o "$jar" \
              "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$v/android-all-instrumented-$v.jar"
            size=$(stat -c%s "$jar")
            if [ "$size" -lt 50000000 ]; then
              echo "Robolectric framework jar too small ($size bytes) — likely a Maven Central error page, not the real jar."
              head -c 512 "$jar" || true
              exit 1
            fi
            echo "  OK: $size bytes"
          done

      - name: Assemble Release
        run: |
          ./gradlew build assembleRelease \
            -DRELEASE_STORE_FILE=../release.keystore \
            -DRELEASE_STORE_PASSWORD='${{ secrets.RELEASE_STORE_PASSWORD }}' \
            -DRELEASE_KEY_ALIAS='${{ secrets.RELEASE_KEY_ALIAS }}' \
            -DRELEASE_KEY_PASSWORD='${{ secrets.RELEASE_KEY_PASSWORD }}'

      - name: Upload release mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release.apk
          path: mobile/build/outputs/apk/release/mobile-release.apk
          if-no-files-found: warn

      - name: Upload release wear APK
        uses: actions/upload-artifact@v4
        with:
          name: wear-release.apk
          path: wear/build/outputs/apk/release/wear-release.apk
          if-no-files-found: warn

      - name: Unit Test
        run: ./gradlew testDebugUnitTest

      - name: Android Test Report
        uses: asadmansr/android-test-report-action@v1.2.0
        if: ${{ always() }} # IMPORTANT: run Android Test Report regardless

      - name: List Files
        run: find .
        if: ${{ always() }} 

      - name: version
        id: version
        run: |
          v=$(grep 'controlx2_version =' build.gradle | cut -f2 -d= | tr -d '"' | tr -d '[:space:]')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.event.ref, 'refs/tags/v')
        with:
          prerelease: true
          name: ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: |
            mobile/build/outputs/apk/release/mobile-release.apk
            wear/build/outputs/apk/release/wear-release.apk
